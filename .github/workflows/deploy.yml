name: Deploy Cloud Run with Terraform

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Authenticate with GCP
      - name: Authenticate with GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # 2b. Install gcloud CLI (needed for the configure-docker step below)
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # 3. Configure Docker for Artifact Registry
      - name: Configure Docker for GCP
        run: gcloud auth configure-docker us-central1-docker.pkg.dev

      # 4. Build Docker image
      - name: Build Docker image
        run: |
          IMAGE_NAME=us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT }}/gcp-practice-frontend/my-app:${{ github.sha }}
          echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV
          docker build -t $IMAGE_NAME .

      # 5. Push Docker image
      - name: Push Docker image
        run: docker push $IMAGE_NAME

      # 6. Set up Terraform
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.9.8

      # 7. Terraform initialization
      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      # 8. Terraform apply
      - name: Terraform Apply
        working-directory: ./terraform
        run: |
          terraform apply -auto-approve \
            -var="project_id=${{ secrets.GCP_PROJECT }}" \
            -var="image=$IMAGE_NAME"

      # 9. Output Cloud Run URL
      - name: Show Cloud Run URL
        run: terraform output url